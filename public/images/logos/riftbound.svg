<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="rb-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <filter id="rb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Crest Rune / Crystal -->
  <g transform="translate(200, 30)">
    <polygon points="0,-18 12,-4 0,16 -12,-4" fill="url(#rb-gem)" stroke="#e9d5ff" stroke-width="1.5" filter="url(#rb-glow)" />
    <circle cx="0" cy="-2" r="3" fill="#ffffff" />
    <path d="M-24,-2 L-15,-2 M15,-2 L24,-2" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- RIFTBOUND Stylized Wordmark -->
  <text 
    x="200" 
    y="78" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="38" 
    letter-spacing="5" 
    fill="url(#rb-gold)"
    stroke="#0f172a"
    stroke-width="1.5"
  >
    RIFTBOUND
  </text>

  <!-- Subtitle Tag -->
  <text 
    x="200" 
    y="102" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="800" 
    font-size="10" 
    letter-spacing="6" 
    fill="#94a3b8"
  >
    LEAGUE OF LEGENDS TCG
  </text>
</svg>
